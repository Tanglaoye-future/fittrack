version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitflow-postgres
    environment:
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow123
      POSTGRES_DB: fitflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
